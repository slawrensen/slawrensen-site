<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SL mark specimen</title>
<style>
  body{margin:0;font:14px/1.5 system-ui,sans-serif;background:#e9ecef;color:#111}
  section{padding:24px 28px}
  .dark{background:#0b0d10;color:#c9ced6}
  .light{background:#ffffff}
  .row{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;margin-top:10px}
  figure{margin:0;text-align:center}
  figcaption{font-size:11px;opacity:.7;margin-top:6px}
  img{display:block}
  .px{image-rendering:pixelated}
  h2{font-size:13px;font-weight:600;margin:0}
</style>
<section class="dark">
  <h2>New: design/mark/sl-mark.svg, dark background</h2>
  <div class="row">
    <figure><img src="sl-mark.svg" width="256" height="256" alt=""><figcaption>256</figcaption></figure>
    <figure><img src="sl-mark.svg" width="128" height="128" alt=""><figcaption>128</figcaption></figure>
    <figure><img src="sl-mark.svg" width="64" height="64" alt=""><figcaption>64</figcaption></figure>
    <figure><img src="sl-mark.svg" width="48" height="48" alt=""><figcaption>48</figcaption></figure>
    <figure><img src="sl-mark.svg" width="32" height="32" alt=""><figcaption>32</figcaption></figure>
    <figure><img src="sl-mark.svg" width="24" height="24" alt=""><figcaption>24</figcaption></figure>
    <figure><img src="sl-mark.svg" width="16" height="16" alt=""><figcaption>16</figcaption></figure>
  </div>
  <h2 style="margin-top:22px">Old: public/favicon.svg (font-dependent text)</h2>
  <div class="row">
    <figure><img src="../../public/favicon.svg" width="256" height="256" alt=""><figcaption>256</figcaption></figure>
    <figure><img src="../../public/favicon.svg" width="128" height="128" alt=""><figcaption>128</figcaption></figure>
    <figure><img src="../../public/favicon.svg" width="64" height="64" alt=""><figcaption>64</figcaption></figure>
    <figure><img src="../../public/favicon.svg" width="32" height="32" alt=""><figcaption>32</figcaption></figure>
    <figure><img src="../../public/favicon.svg" width="16" height="16" alt=""><figcaption>16</figcaption></figure>
  </div>
</section>
<section class="light">
  <h2>New, light background</h2>
  <div class="row">
    <figure><img src="sl-mark.svg" width="128" height="128" alt=""><figcaption>128</figcaption></figure>
    <figure><img src="sl-mark.svg" width="64" height="64" alt=""><figcaption>64</figcaption></figure>
    <figure><img src="sl-mark.svg" width="32" height="32" alt=""><figcaption>32</figcaption></figure>
    <figure><img src="sl-mark.svg" width="16" height="16" alt=""><figcaption>16</figcaption></figure>
    <figure><img src="sl-mark.svg" width="16" height="16" class="px" style="width:64px;height:64px" alt=""><figcaption>16 magnified</figcaption></figure>
  </div>
  <h2 style="margin-top:22px">Circular avatar crop (social platforms)</h2>
  <div class="row">
    <figure><img src="sl-mark.svg" width="128" height="128" style="border-radius:50%" alt=""><figcaption>circle 128</figcaption></figure>
    <figure><img src="sl-mark.svg" width="48" height="48" style="border-radius:50%" alt=""><figcaption>circle 48</figcaption></figure>
  </div>
</section>
</html>
