name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the deploy authenticates with the Cloudflare API token
# (repo secret), so the workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy public/ to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The site promises no trackers, no cookies and no third-party requests.
      # That promise is only worth something if it is enforced, so fail the
      # build if the source ever grows an external dependency, a script, or
      # an unversioned asset. The same script runs locally and on pull
      # requests (validate.yaml).
      - name: Verify the source ships no external requests
        run: sh scripts/check-source.sh

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=slawrensen

      # Catches trackers injected at the EDGE (e.g. Cloudflare Web Analytics /
      # RUM auto-injection), which no source check can see.
      - name: Verify the live page ships no trackers
        run: |
          url="https://slawrensen.com/"
          for i in 1 2 3 4 5 6; do
            body="$(curl -fsSL "${url}?ci=$(date +%s)-$i" || true)"
            if [ -n "$body" ]; then
              if printf '%s' "$body" | grep -qE 'cloudflareinsights|<script[^>]+src=' ; then
                echo "Attempt $i: tracker/external script present, retrying after propagation..."
              else
                echo "Live page is clean: no injected beacon, no external scripts."
                exit 0
              fi
            else
              echo "Attempt $i: no response yet, retrying..."
            fi
            sleep 15
          done
          echo "::error::The deployed page contains an injected tracker or external script."
          echo "If this is Cloudflare Web Analytics, disable auto-injection:"
          echo "  Dashboard > Analytics & Logs > Web Analytics > slawrensen.com > Manage site"
          exit 1

      # The CSP in public/_headers is what makes the promise enforceable in the
      # visitor's browser, so check the policy the edge actually delivers.
      - name: Verify the live page carries the content security policy
        run: |
          url="https://slawrensen.com/"
          for i in 1 2 3 4 5 6; do
            csp="$(curl -fsSI "${url}?ci=$(date +%s)-$i" | tr -d '\r' | grep -i '^content-security-policy:' || true)"
            if printf '%s' "$csp" | grep -q "default-src 'none'" && printf '%s' "$csp" | grep -q "script-src 'none'"; then
              echo "Live CSP: $csp"
              exit 0
            fi
            echo "Attempt $i: CSP not yet as expected (${csp:-missing}), retrying..."
            sleep 15
          done
          echo "::error::The live page does not carry the expected Content-Security-Policy."
          exit 1
