<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="darkreader-lock">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No signal · slawrensen</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  /* Same tokens as index.html: pure black and the plugin's Void theme. */
  :root{
    --bg:#000000; --text:#f4f6fa; --muted:#a3abb8; --faint:#7a8393;
    --accent:#4cc2ff; --line-2:#2a2f3a; --line-ui:#5a6373;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"SF Mono","Cascadia Code","JetBrains Mono",Consolas,ui-monospace,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box; margin:0}
  a{color:inherit; text-decoration:none}
  body{
    min-height:100vh; min-height:100svh; display:grid; place-items:center; padding:32px 24px;
    background:var(--bg); color:var(--text); font-family:var(--sans); line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  main{width:100%; max-width:44ch}
  .eyebrow{
    display:inline-flex; align-items:center; gap:10px; color:var(--accent);
    font-family:var(--mono); font-size:.75rem; letter-spacing:.2em; text-transform:uppercase;
  }
  .eyebrow::before{content:""; width:22px; height:1px; background:currentColor; opacity:.55}
  h1{font-size:clamp(1.7rem,1.2rem + 2vw,2.4rem); line-height:1.12; letter-spacing:-.02em; margin-top:.5em; font-weight:600; text-wrap:balance}
  p{color:var(--muted); margin-top:14px}
  a.home{
    display:inline-flex; align-items:center; gap:9px; margin-top:28px; min-height:46px; padding:6px 20px;
    border:1px solid var(--line-ui); border-radius:12px; color:var(--text); font-weight:600; font-size:.95rem;
  }
  a.home:hover{border-color:var(--muted)}
  :focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:8px}
  .brand{display:flex; width:max-content; align-items:center; gap:11px; min-height:44px; margin-bottom:30px; font-weight:600}
  .mark{
    width:2.35em; height:2.35em; border-radius:.6em; display:grid; place-items:center;
    background:var(--bg); border:1px solid var(--line-2); border-bottom:3px solid var(--accent);
    color:var(--text); font-family:var(--mono); font-weight:800; font-size:.8rem;
  }
</style>
</head>
<body>
<main>
  <a class="brand" href="/"><span class="mark" aria-hidden="true">SL</span><span>slawrensen</span></a>
  <p class="eyebrow">404 · No signal</p>
  <h1>That page is not on this site.</h1>
  <p>The address does not match anything here. The site is one page, and both plugins are on it.</p>
  <a class="home" href="/">Back to slawrensen.com</a>
</main>
</body>
</html>
