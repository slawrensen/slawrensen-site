<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="darkreader-lock">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · slawrensen</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14120d">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon-v1.png">
<style>
  /* Same tokens and typeface as index.html. Paths are absolute: this page is served at any address. */
  @font-face{
    font-family:"Atkinson Hyperlegible Next";
    src:url(/assets/atkinson-hyperlegible-next-v1.woff2) format("woff2");
    font-weight:200 800; font-style:normal; font-display:swap;
  }
  :root{
    color-scheme:dark;
    --ink:#14120d; --paper:#e9e6de; --text:#cdc9bd;
    --font:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box; margin:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh; min-height:100svh; display:grid; place-items:center; padding:32px 24px;
    background:var(--ink); color:var(--text);
    font-family:var(--font); font-size:1.0625rem; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  main{width:100%; max-width:30rem}
  ::selection{background:var(--paper); color:var(--ink)}
  :focus-visible{outline:2px solid var(--paper); outline-offset:3px; border-radius:6px}
  .brand{display:inline-flex; align-items:center; gap:10px; min-height:44px; font-weight:700; color:var(--paper); text-decoration:none}
  .mark{
    display:grid; place-items:center; width:2.15em; height:2.15em; flex:none; border-radius:.55em;
    background:var(--paper); border:1px solid var(--paper); color:var(--ink);
    font-weight:800; font-size:.875rem; letter-spacing:-.02em;
  }
  h1{margin-top:28px; color:var(--paper); font-size:min(clamp(2.1rem,1.5rem + 3vw,2.9rem),12vw); font-weight:800; line-height:1.05; letter-spacing:-.025em; text-wrap:balance}
  p{margin-top:14px}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; min-height:46px; margin-top:26px; padding:8px 18px;
    border-radius:10px; border:1px solid var(--paper); background:var(--paper);
    color:var(--ink); font-weight:700; text-decoration:none;
  }
  .btn:hover{background:#f6f4ef; border-color:#f6f4ef}
  .btn:active{background:var(--text); border-color:var(--text)}
  /* Dark Reader running despite the lock repaints light fills dark: keep their edge. */
  html[data-darkreader-scheme] .btn{border-width:2px; border-color:currentColor}
  html[data-darkreader-scheme] .mark{border-color:currentColor}
</style>
</head>
<body>
<main>
  <a class="brand" href="/"><span class="mark" aria-hidden="true">SL</span>slawrensen</a>
  <h1>Nothing at this address.</h1>
  <p>Error 404. The site is one page, and both plugins are on it.</p>
  <a class="btn" href="/">Go to slawrensen.com</a>
</main>
</body>
</html>
